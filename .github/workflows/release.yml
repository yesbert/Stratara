# Publish the 25 packages to nuget.org. Version tags only.
#
# The tag is the deliberate "release this" signal. A push to a branch never publishes: what is not
# tagged is not published anywhere. The tag may name a prerelease — its identifier rides through to
# VersionSuffix — and that changes who installs it, not how deliberate publishing it is.
#
# Three jobs, cut by what each one is trusted with. `pack` builds, tests and packs without any
# credential in scope. `publish` runs in the `nuget-org` environment, which carries a required
# reviewer — a push to nuget.org cannot be taken back, packages can be deprecated or unlisted but
# never deleted, so a human confirms before the packages leave. `announce` then creates this
# repository's release entry for the tag, and holds the only `contents: write` token in the
# workflow — which is why it is a job of its own and not a step at the end of `publish`.
#
# Publishing uses trusted publishing: the job proves its identity to nuget.org with a short-lived
# OIDC token and gets an API key valid for one hour, so no long-lived key is stored anywhere. One
# policy on nuget.org covers every package the account owns, and it names this repository, this
# workflow file and this environment — a workflow that is not this one cannot use it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Build + test + pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Deterministic builds and SourceLink need the full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the version, and the working tree has to agree with it — but only about which
      # version is being worked toward. Directory.Build.props states that; the tag states which build
      # of it this is. So the release part of the tag must equal <VersionPrefix>, while the
      # prerelease identifier after the first hyphen is free and rides through to pack as
      # VersionSuffix. A tag whose release part disagrees still means the bump and the tag drifted
      # apart, and publishing either of them would be a guess.
      - name: Resolve and verify the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          release="${tag%%-*}"
          suffix=""
          [[ "${tag}" == *-* ]] && suffix="${tag#*-}"
          props="$(sed -n 's|.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*|\1|p' Directory.Build.props)"
          if [[ "${release}" != "${props}" ]]; then
            echo "Tag v${tag} disagrees with Directory.Build.props <VersionPrefix>${props}</VersionPrefix>." >&2
            echo "Bump with the bump-version skill so the tag and the props agree, then re-tag." >&2
            exit 1
          fi
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          if [[ -n "${suffix}" ]]; then
            echo "Releasing version ${tag} — a prerelease of ${release}"
          else
            echo "Releasing version ${tag}"
          fi

      - name: Restore
        run: dotnet restore Stratara.Publish.slnf --locked-mode || dotnet restore Stratara.Publish.slnf

      - name: Build
        run: dotnet build Stratara.Publish.slnf -c Release --no-restore --nologo /p:ContinuousIntegrationBuild=true

      # A tag must not publish from a red tree. Integration suites are excluded — they need Docker
      # and run in integration.yml.
      - name: Unit tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p TestResults
          failed=0
          for proj in tests/*/*.Tests.csproj; do
            [[ -f "${proj}" ]] || continue
            [[ "${proj}" == *IntegrationTests* ]] && continue
            name="$(basename "$(dirname "${proj}")")"
            echo ""
            echo "=== ${name} ==="
            dotnet test "${proj}" -c Release --no-build -- \
              --report-xunit-trx \
              --report-xunit-trx-filename "${name}.trx" \
              --results-directory TestResults \
              || failed=1
          done
          exit ${failed}

      # VersionSuffix comes from the tag and overrides the `dev` default in Directory.Build.props.
      # It is empty for a stable tag, so the packages carry exactly the version the tag names; for a
      # prerelease tag it is the identifier after the first hyphen, so v4.0.0-preview.1 packs
      # 4.0.0-preview.1.
      - name: Pack
        run: |
          dotnet pack Stratara.Publish.slnf \
            -c Release \
            --no-build \
            --nologo \
            /p:ContinuousIntegrationBuild=true \
            /p:VersionSuffix=${{ steps.version.outputs.suffix }} \
            -o artifacts/nupkgs

      - name: List what was produced
        run: ls -la artifacts/nupkgs

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/nupkgs
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate. Nothing below runs until a reviewer confirms.
    environment: nuget-org
    permissions:
      contents: read
      id-token: write   # lets the job request the OIDC token trusted publishing exchanges
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The key this returns is valid for one hour, so it is fetched immediately before the push.
      # There is no fallback: if the exchange fails the release stops here, which is the point. It
      # first published through this path on 2026-08-31 with v4.0.0-preview.1.
      - name: Exchange the OIDC token for a short-lived key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Sibling .snupkg files are discovered by `dotnet nuget push` and forwarded to
      # symbols.nuget.org in the same call, so there is no separate symbol push.
      # --skip-duplicate keeps the job idempotent across a re-run of the same tag.
      - name: Push
        env:
          SHORT_LIVED_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SHORT_LIVED_KEY:-}" ]]; then
            echo "Trusted publishing yielded no key. The policy on nuget.org is missing or does" >&2
            echo "not match (owner yesbert, repository Stratara, workflow release.yml, environment" >&2
            echo "nuget-org). Nothing is published; fix the policy rather than storing a key." >&2
            exit 1
          fi
          key="${SHORT_LIVED_KEY}"
          echo "Publishing with a short-lived key from trusted publishing."
          cd artifacts/nupkgs
          echo "Pushing $(ls ./*.nupkg | wc -l | tr -d ' ') packages"
          for nupkg in ./*.nupkg; do
            echo "--- ${nupkg} ---"
            dotnet nuget push "${nupkg}" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${key}" \
              --skip-duplicate
          done

  # The third job, and the reason it is a job rather than a step at the end of `publish`: creating a
  # release entry needs `contents: write`, and that token has no business in the job that holds the
  # nuget.org key and the packages about to leave. `pack` is kept apart from `publish` by exactly
  # this argument; announcing extends the cut rather than widening the job that carries a credential.
  #
  # `needs: publish` inherits the approval gate rather than declaring a second one. A reviewer who
  # declines produces no packages and no announcement, and a push that fails announces nothing —
  # what is announced is what was published.
  announce:
    name: Announce the release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # creating the release entry — the only write anywhere in this workflow
    steps:
      # The tag is what is checked out, so CHANGELOG.md below is the one the release was cut from.
      - uses: actions/checkout@v4

      # The release part of the tag, by the same first-hyphen boundary the version check in `pack`
      # uses — one definition of "is this a prerelease" in this workflow, not two that can drift.
      # The changelog documents versions rather than builds of them, so a prerelease takes its notes
      # from the section of the version it is a prerelease of. That is already what
      # build/PackageReleaseNotes.targets does with $(VersionPrefix), so the packages and this entry
      # quote the same text.
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "value=${version}"
            echo "release=${version%%-*}"
          } >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Announcing ${version} as a prerelease of ${version%%-*}"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Announcing ${version}"
          fi

      # The second implementation of the match in build/PackageReleaseNotes.targets. That one feeds
      # <PackageReleaseNotes> at pack time and is written in C#; this one feeds the release entry and
      # is written in awk. Both take the `## [<version>]` heading and the body up to the next
      # `## [` heading. Two languages, one changelog — keep the pair in step rather than deleting
      # either as redundant.
      #
      # A version the changelog does not document is announced without notes instead of failing the
      # release, which is what the pack side does with the same absence.
      - name: Extract the changelog section
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v want="## [${{ steps.version.outputs.release }}]" '
            index($0, want) == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture {
              if (!started && !NF) next
              started = 1
              lines[++n] = $0
              if (NF) last = n
            }
            END { for (i = 1; i <= last; i++) print lines[i] }
          ' CHANGELOG.md > release-notes.md
          if [[ -s release-notes.md ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Extracted $(wc -l < release-notes.md) lines from the changelog."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No '## [${{ steps.version.outputs.release }}]' section in CHANGELOG.md;"
            echo "announcing without notes rather than failing a release that already published."
          fi

      # An entry that exists is left alone rather than overwritten: a maintainer may have edited it
      # by hand after the fact, and a re-run must not discard that silently. Declining to overwrite
      # is what --skip-duplicate does on the push loop above.
      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "A release entry for ${tag} already exists; leaving it untouched."
            exit 0
          fi
          args=(--title "Stratara ${{ steps.version.outputs.value }}" --verify-tag)
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "${{ steps.notes.outputs.found }}" == "true" ]]; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--notes "")
          fi
          gh release create "${tag}" "${args[@]}"
