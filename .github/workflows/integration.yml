# The integration suites — the tests that need real infrastructure.
#
# They bring up Redis, RabbitMQ and PostgreSQL through Testcontainers, so they need a Docker daemon.
# The hosted Ubuntu runner has one, and the runner user is already in the docker group.
#
# Deliberately not a required check on pull requests. Container startup is the flakiest thing in
# this repository's CI, and a flaky required check teaches people to re-run rather than to read.
# Promote it once the suite has been stable for a stretch of runs.
name: Integration tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Integration suite (Testcontainers)
    runs-on: ubuntu-latest
    # The Orleans suite alone takes around 18 minutes once its kill tests actually run; the build
    # and the container pulls come on top.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Docker sanity
        run: |
          docker --version
          docker info | head -20

      # The loop picks up every *IntegrationTests project, so adding one needs no edit here.
      - name: Build the integration test projects
        shell: bash
        run: |
          set -euo pipefail
          for csproj in tests/*IntegrationTests/*.csproj; do
            [[ -f "${csproj}" ]] || continue
            echo "=== Building ${csproj} ==="
            dotnet build "${csproj}" -c Release --nologo
          done

      # The Orleans kill-and-restart tests spawn a second process, the scenario host in
      # Stratara.Orleans.Benchmarks, and look for its assembly beside their own output in the same
      # configuration. The host references the test project, not the other way round, so the loop
      # above never builds it; without this step every kill test fails before it starts.
      - name: Build the scenario host the Orleans integration tests spawn
        run: dotnet build tests/Stratara.Orleans.Benchmarks/Stratara.Orleans.Benchmarks.csproj -c Release --nologo

      - name: Run the integration tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p TestResults
          failed=0
          for csproj in tests/*IntegrationTests/*.csproj; do
            [[ -f "${csproj}" ]] || continue
            name="$(basename "$(dirname "${csproj}")")"
            echo ""
            echo "=== ${name} ==="
            dotnet test "${csproj}" -c Release --no-build -- \
              --report-xunit-trx \
              --report-xunit-trx-filename "${name}.trx" \
              --results-directory TestResults \
              || failed=1
          done
          exit ${failed}

      - name: Publish the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
