# Deploy the documentation site to stratara.tech.
#
# Builds the DocFX site exactly as docs.yml did and copies it by rsync to the document root of the
# stratara.tech vhost on our own server. Runs on merges to main that touch the site, and can be
# started by hand. Never on a pull request: the job holds a deploy key, and a fork's run gets no
# secrets — which is exactly the protection that makes a public repository safe to run this in.
#
# The `production` environment carries a required reviewer, so the deploy waits for a human. The key
# can write the document root of a public site; a bad merge or a compromised action would otherwise
# ship unattended. Same reasoning as the nuget-org gate in release.yml.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - llms.txt
      - llms-full.txt
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

# Two deploys must not interleave: rsync --delete from two runs at once leaves neither tree intact.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate. Nothing below runs until a reviewer confirms.
    environment:
      name: production
      url: https://stratara.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Pinned, because docs/templates/stratara/layout/_master.tmpl is a copy of this version's
      # modern template. An unpinned install would let a docfx release move the original out from
      # under the fork without a single failing check. DocfxForkProvenanceTests reads the version
      # from both places and fails when they disagree, so the pin and the fork move together.
      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.5

      # The same two commands docs.yml ran, so the move changes where the site lives and nothing
      # about how it is built.
      - name: Build DocFX site (warningsAsErrors)
        run: |
          docfx metadata docs/docfx.json
          docfx build docs/docfx.json --warningsAsErrors

      # llms.txt and llms-full.txt live at the repository root and are not DocFX resources; they are
      # served from the site root so that the trigger paths above mean something.
      - name: Add llms.txt to the site root
        run: cp llms.txt llms-full.txt docs/_site/

      # Plesk's nginx proxies to Apache, so cache headers are an .htaccess file rather than server
      # configuration. Everything the browser navigates to or the search reads (HTML, JSON, TXT,
      # XML, YML) revalidates on every request.
      #
      # Under public/ the default is also revalidate, and only the fingerprinted files opt out of
      # it. That order matters, and getting it wrong is not theoretical: until 2026-09-06 this file
      # named the fingerprinted files alone, so DocFX's unfingerprinted main.css, main.js,
      # docfx.min.css, docfx.min.js and search-worker.min.js were served with no Cache-Control at
      # all. A browser then caches them heuristically — and a visitor who had the site open before
      # a deploy got the new HTML, which does revalidate, against the old stylesheet, which did
      # not. That is how the skip link this template added shipped unstyled and visible.
      #
      # Apache applies these two sections in order and the later Header set wins, so the blanket
      # rule has to come first.
      - name: Add cache headers
        run: |
          set -euo pipefail
          cat > docs/_site/.htaccess <<'HTACCESS'
          <IfModule mod_headers.c>
            <FilesMatch "\.(html|json|txt|xml|yml)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          HTACCESS
          cat > docs/_site/public/.htaccess <<'HTACCESS'
          <IfModule mod_headers.c>
            <FilesMatch "\.(js|css|woff2?)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
            <FilesMatch "-[A-Z0-9]{8}(\.min)?\.(js|css|woff2?)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          HTACCESS

      - name: Prepare the deploy key
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/stratara_deploy
          chmod 600 ~/.ssh/stratara_deploy
          echo "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      # --delete makes the deployed tree equal the built tree, so a renamed page does not linger.
      # .well-known is excluded because Plesk keeps its ACME challenge directory there; deleting it
      # on every deploy is a bet on a Plesk routing detail that costs nothing to avoid.
      - name: Deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          rsync -az --delete --exclude='.well-known' -e 'ssh -i ~/.ssh/stratara_deploy' \
            docs/_site/ "${DEPLOY_USER}@${DEPLOY_HOST}:httpdocs/"

      # A deploy that reports success while the site is broken is worse than one that fails, so this
      # asks the live domain rather than trusting the upload.
      - name: Check what is actually served
        run: |
          set -euo pipefail
          # Here-strings, not a pipe into grep: with pipefail, `grep -q` exits on the first match, a
          # curl still writing the rest of a large page gets a broken pipe, and the check fails on a
          # page that was correct.
          contains() {
            local body
            body=$(curl -fsS "$1")
            grep -qi -- "$2" <<<"$body" || { echo "$3"; exit 1; }
          }
          status_is() {
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "$1")
            [ "$code" = "$2" ] || { echo "$3 — got $code"; exit 1; }
          }
          header_has() {
            local headers
            headers=$(curl -fsSI "$1")
            grep -qi -- "$2" <<<"$headers" || { echo "$3"; exit 1; }
          }
          # The apex itself must answer, not redirect: a 301 to www would mean Plesk's preferred
          # domain still points the other way, and every published link would take a detour.
          status_is https://stratara.tech/ 200 "the apex does not answer with the site itself"
          contains https://stratara.tech/ "Start small, keep the receipts" "the landing page is not the documentation"
          status_is https://stratara.tech/concepts/why-event-sourcing.html 200 "a deep page is missing"
          status_is https://stratara.tech/legal/imprint.html 200 "the imprint is not served"
          status_is https://stratara.tech/legal/privacy.html 200 "the privacy policy is not served"
          status_is https://stratara.tech/assets/badges/nuget.svg 200 "the badges are not served from our own host"
          status_is https://stratara.tech/llms.txt 200 "llms.txt is not served"
          header_has https://stratara.tech/ 'cache-control: no-cache' "the no-cache header is missing on the landing page"
          # The stylesheet is unfingerprinted, so a browser that does not revalidate it will pair a
          # fresh page with a stale one. Asserting it here is what stops that regressing quietly.
          header_has https://stratara.tech/public/main.css 'cache-control: no-cache' \
            "main.css is served without no-cache — a visitor keeps the old stylesheet against the new HTML"
          header_has https://stratara.tech/public/main.js 'cache-control: no-cache' \
            "main.js is served without no-cache"
          # And the fingerprinted files must still be immutable: the blanket rule above them must
          # not have swallowed the exception.
          fingerprinted=$(curl -fsS https://stratara.tech/public/docfx.min.js \
            | grep -oE '[a-zA-Z0-9]+-[A-Z0-9]{8}\.min\.js' | head -1)
          [ -n "$fingerprinted" ] || { echo "no fingerprinted asset found to check"; exit 1; }
          header_has "https://stratara.tech/public/$fingerprinted" 'immutable' \
            "the fingerprinted assets lost their immutable header"
          echo "stratara.tech answers, deep links resolve, and the pages that must not go stale revalidate."
