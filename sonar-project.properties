# SonarQube Project Configuration
# https://docs.sonarsource.com/sonarqube-community-build/analyzing-source-code/analysis-parameters/
#
# NOTE: the .NET scanner does NOT read this file. The analysis workflow passes
# every property on the command line instead. This file serves as documentation
# only — it mirrors the same exclusions so a developer can inspect and reason
# about the analysis scope without reading .github/workflows/sonar.yml.

sonar.projectKey=stratara
sonar.projectName=Stratara
sonar.projectVersion=1.0

# Source directories
sonar.sources=src

# Test directories
sonar.tests=tests

# Exclude from analysis
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/TestResults/**,\
  artifacts/**,\
  reports/**,\
  samples/**,\
  scripts/**,\
  tools/**,\
  **/*.g.cs,\
  tmp/**,\
  docs/**,\
  .junie/**

# Exclude from coverage calculation.
# Files marked with [ExcludeFromCodeCoverage] are excluded from coverlet reports,
# but SonarQube treats missing coverage data as 0% covered. These exclusions
# align SonarQube's coverage scope with coverlet's scope.
#
# Rationale per path:
#   - Stratara.Contracts         — wire-level POCO records (data-only)
#   - Stratara.Diagnostics       — ActivitySource / Meter / LogEvent schema
#   - Stratara.Identity.AspNetCore — ASP.NET-Core identity wiring (host glue)
#   - Stratara.ServiceDefaults / .AspNetCore — OTel + Serilog + ASP.NET host bootstrap
#   - *Command.cs / *Query.cs / *Event(s).cs / *Dto.cs / *Options.cs — data-only / dispatch glue
#   - *DbContext.cs              — EF Core configuration plumbing
#   - LogEvents.cs               — source-generated [LoggerMessage] schema
#   - Program.cs / Migrations/** — host entry + EF migrations
sonar.coverage.exclusions=\
  src/Stratara.Contracts/**,\
  src/Stratara.Diagnostics/**,\
  src/Stratara.Identity.AspNetCore/**,\
  src/Stratara.ServiceDefaults/**,\
  src/Stratara.ServiceDefaults.AspNetCore/**,\
  **/*Command.cs,\
  **/*Query.cs,\
  **/*Event.cs,\
  **/*Events.cs,\
  **/*DbContext.cs,\
  **/*Dto.cs,\
  **/*Options.cs,\
  **/LogEvents.cs,\
  **/Program.cs,\
  **/Migrations/**

# Copy-paste detection: Contracts/DTOs/Options/Events naturally repeat patterns.
sonar.cpd.exclusions=\
  src/Stratara.Contracts/**/*.cs,\
  **/*Dto.cs,\
  **/*Options.cs,\
  **/*Event.cs,\
  **/*Events.cs

# Test inclusions (don't count test code as production source)
sonar.test.inclusions=\
  tests/**/*.cs

# Language settings
sonar.cs.file.suffixes=.cs

# False-positive suppressions — keep in sync with .github/workflows/sonar.yml.
# Rationale per entry:
#   ireadonlyListConvention (CA1859)   — Stratara public API surface uses IReadOnly* /
#                                         abstractions on purpose; the perf delta on
#                                         private methods is microscopic and the
#                                         readability/refactor-safety loss is real.
#   constantArraysInTests (CA1861)     — array allocation perf advice irrelevant in single-run [Fact] tests.
#   staticMethodsInTests (CA1822)      — "could be static" perf advice irrelevant in test fixtures.
#   docCommentsLookLikeCode (S125)     — XML doc comments on the public API surface (mandated by the
#                                         framework's NuGet-doc policy) frequently contain
#                                         `<example>` / `<code>` blocks. Sonar's "commented-out code"
#                                         heuristic flags any block with CamelCase identifiers +
#                                         brackets, which matches the documentation style.
sonar.issue.ignore.multicriteria=ireadonlyListConvention,constantArraysInTests,staticMethodsInTests,docCommentsLookLikeCode
sonar.issue.ignore.multicriteria.ireadonlyListConvention.ruleKey=external_roslyn:CA1859
sonar.issue.ignore.multicriteria.ireadonlyListConvention.resourceKey=**
sonar.issue.ignore.multicriteria.constantArraysInTests.ruleKey=external_roslyn:CA1861
sonar.issue.ignore.multicriteria.constantArraysInTests.resourceKey=tests/**
sonar.issue.ignore.multicriteria.staticMethodsInTests.ruleKey=external_roslyn:CA1822
sonar.issue.ignore.multicriteria.staticMethodsInTests.resourceKey=tests/**
sonar.issue.ignore.multicriteria.docCommentsLookLikeCode.ruleKey=csharpsquid:S125
sonar.issue.ignore.multicriteria.docCommentsLookLikeCode.resourceKey=src/**

# Encoding
sonar.sourceEncoding=UTF-8
