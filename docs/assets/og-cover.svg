<?xml version="1.0" encoding="UTF-8"?>
<!--
  The editable master of the Open Graph cover. scripts/refresh-og-cover.sh renders it to
  og-cover.png, which is what og:image and twitter:image point at — no major consumer of Open Graph
  renders SVG, so the PNG is the artefact and this is its source.

  logo.png is referenced rather than redrawn so the mark and the wordmark stay pixel-true to the
  brand; the href is relative and resolves because both files live in this directory.
  The blue is the brand custom property in templates/stratara/public/main.css: rgb(6, 115, 203).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="16" height="630" fill="#0673cb"/>
  <rect x="0" y="614" width="1200" height="16" fill="#0673cb"/>

  <image xlink:href="logo.png" x="400" y="92" width="400" height="335"/>

  <text x="600" y="500" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="600" fill="#0673cb">CQRS and Event Sourcing for .NET</text>

  <text x="600" y="552" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#4d5154">25 MIT-licensed packages, one lockstep version</text>
</svg>
